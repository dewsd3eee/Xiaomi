<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Xiaomi Scooter BLE Inspector</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:#f5f5f7;background:#0b0c0f}
*{box-sizing:border-box} body{margin:0;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 4px}.sub{color:#a5a7ad;margin-bottom:20px}
.card{background:#17191e;border:1px solid #292c33;border-radius:18px;padding:16px;margin:12px 0}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:#fff;color:#111;cursor:pointer}
button.secondary{background:#272a31;color:#fff}.status{display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:#777}.dot.ok{background:#45d483}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.value{font-size:25px;font-weight:700}.label{color:#9b9da5;font-size:13px}
pre{white-space:pre-wrap;word-break:break-all;color:#d9dbe1;font-size:12px;line-height:1.45}
.row{padding:12px 0;border-top:1px solid #292c33}.row:first-child{border-top:0}
.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#292c33;color:#bbb;font-size:11px}
.warn{color:#ffcc66;font-size:13px;line-height:1.45}
</style>
</head>
<body>
<h1>🛴 Scooter BLE</h1>
<div class="sub">Xiaomi 4 Lite (2. Gen.) · Bluefy / Web Bluetooth</div>

<div class="card">
  <div class="status"><span id="dot" class="dot"></span><strong id="status">Nicht verbunden</strong></div>
  <div style="height:12px"></div>
  <button id="connect">Scooter verbinden</button>
  <div style="height:8px"></div>
  <button id="disconnect" class="secondary" disabled>Trennen</button>
</div>

<div class="card">
  <div class="grid">
    <div><div class="label">Gerät</div><div id="name" class="value">—</div></div>
    <div><div class="label">Services</div><div id="count" class="value">0</div></div>
  </div>
</div>

<div class="card">
  <strong>BLE-Diagnose</strong>
  <p class="warn">Diese Version liest nur öffentlich bereitgestellte BLE-Informationen. Sie sendet keine Fahr-, Motor-, Brems-, Sperr- oder Firmware-Befehle.</p>
  <div id="services"><span class="label">Noch keine Verbindung.</span></div>
</div>

<div class="card">
<strong>Log</strong>
<pre id="log">Bereit.</pre>
</div>

<script>
let device=null;
const $=id=>document.getElementById(id);
function log(x){$("log").textContent += "\\n"+x; $("log").scrollTop=$("log").scrollHeight}
function setConnected(v){
  $("dot").className="dot"+(v?" ok":"");
  $("status").textContent=v?"Verbunden":"Nicht verbunden";
  $("connect").disabled=v; $("disconnect").disabled=!v;
}
function hex(a){return [...new Uint8Array(a)].map(x=>x.toString(16).padStart(2,"0")).join(" ")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function connect(){
  if(!navigator.bluetooth){alert("Dieser Browser unterstützt Web Bluetooth nicht. Öffne die Datei in einem Web-Bluetooth-fähigen Browser wie Bluefy.");return}
  try{
    $("status").textContent="Suche Bluetooth-Geräte …";
    device=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:["device_information","battery_service"]
    });
    $("name").textContent=device.name||"Unbenannt";
    log("Gerät ausgewählt: "+(device.name||"(ohne Namen)"));
    device.addEventListener("gattserverdisconnected",()=>{
      setConnected(false); log("GATT-Verbindung getrennt.");
    });
    const server=await device.gatt.connect();
    setConnected(true);
    log("GATT verbunden.");
    const services=await server.getPrimaryServices();
    $("count").textContent=services.length;
    $("services").innerHTML="";
    for(const s of services){
      const box=document.createElement("div"); box.className="row";
      box.innerHTML="<strong>"+esc(s.uuid)+"</strong><br><span class='badge'>Primary service</span>";
      $("services").appendChild(box);
      log("Service: "+s.uuid);
      try{
        const chars=await s.getCharacteristics();
        for(const c of chars){
          const r=document.createElement("div"); r.style.marginTop="10px";
          r.innerHTML="<span class='badge'>Characteristic</span><br><code>"+esc(c.uuid)+"</code><br><span class='label'>Properties: "+esc([...c.properties].join(", ")||"—")+"</span>";
          box.appendChild(r);
          log("  Characteristic: "+c.uuid+" ["+[...c.properties].join(", ")+"]");
        }
      }catch(e){log("  Characteristics nicht lesbar: "+e.message)}
    }
  }catch(e){
    setConnected(false);
    log("Fehler: "+e.name+" — "+e.message);
  }
}
$("connect").onclick=connect;
$("disconnect").onclick=()=>{
  if(device?.gatt?.connected) device.gatt.disconnect();
  setConnected(false);
};
</script>
</body>
</html>
